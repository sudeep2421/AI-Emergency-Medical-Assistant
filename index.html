<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>
        <h1><i class="fa-solid fa-user-doctor"></i> AI Emergency Medical Assistant</h1>
    </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1><i class="fa-solid fa-user-doctor"></i> AI Emergency Medical Assistant</h1>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="left-panel">

            <div class="card">

                <h2>Symptoms</h2>

                <form id="symptomForm">

                    <label><input type="checkbox" id="fever"> Fever</label>
                    <label><input type="checkbox" id="cough"> Cough</label>
                    <label><input type="checkbox" id="headache"> Headache</label>
                    <label><input type="checkbox" id="fatigue"> Fatigue</label>
                    <label><input type="checkbox" id="vomiting"> Vomiting</label>

                    <button type="submit">Predict Disease</button>

                </form>

            </div>


            <div class="card">

                <h2> Prediction Result</h2>

                <p id="result">Your result will appear here</p>

            </div>


            <div class="card emergency-card">

                <h2> Emergency Help</h2>

                <button onclick="findHospital()">Find Nearby Hospital</button>

                <a href="tel:108">
                    <button class="ambulance">🚑 Call Ambulance</button>
                </a>

            </div>

        </div>


        <!-- RIGHT SIDE CHATBOT -->

        <div class="right-panel">

            <div class="card chatbot-card">

                <h2>🤖 Medical Chatbot</h2>

                <div class="bot-avatar">
                    <i class="fa-solid fa-robot"></i>
                    <p>Doctor AI Assistant</p>
                </div>

                <div id="chatlogs"></div>

                <input type="text" id="userInput" placeholder="Ask a health question">

                <button onclick="sendMessage()">Send</button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
